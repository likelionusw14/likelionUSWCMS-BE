version: '3.8'

services:
  app:
    build: .
    container_name: likelion-cms-app
    ports:
      - "8080:8080"
    environment:
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:?KAKAO_REDIRECT_URI is required}
      - FRONTEND_DEFAULT_ORIGIN=${FRONTEND_DEFAULT_ORIGIN:?FRONTEND_DEFAULT_ORIGIN is required}
      - FRONTEND_CALLBACK_PATH=${FRONTEND_CALLBACK_PATH:-/auth/callback}
      - FRONTEND_ALLOWED_ORIGINS=${FRONTEND_ALLOWED_ORIGINS:?FRONTEND_ALLOWED_ORIGINS is required}
      - CSRF_COOKIE_DOMAIN=${CSRF_COOKIE_DOMAIN:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
    depends_on:
      - mysql-db
      - redis
    restart: always

  mysql-db:
    image: mysql:8.0
    container_name: likelion-cms-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_DATABASE=cms
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: always

  redis:
    image: redis:7-alpine
    container_name: likelion-cms-redis
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: likelion-cms-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: always

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
