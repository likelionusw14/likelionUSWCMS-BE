spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 로컬 테스트용: 엔티티 기준으로 없는 테이블/컬럼만 자동 추가
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 아래는 로컬 개발용 더미 값이다.
# application.yml이 이 값들을 기본값 없는 필수 환경변수(${...})로 요구하기 때문에,
# 로컬 프로필에서 채워두지 않으면 앱이 기동되지 않는다. 실제 배포는 환경변수로 주입된다.
kakao:
  client-id: local-dummy-client-id
  redirect-uri: http://localhost:8080/api/auth/kakao/callback

app:
  frontend:
    default-origin: http://localhost:5173
    callback-path: /auth/callback
    allowed-origins: http://localhost:5173

jwt:
  secret: temporary-local-dev-secret-key-1234567890abcdefghijklmnop

storage:
  s3:
    bucket-name: local-dummy-bucket
