spring:
  application:
    name: likelion-usw-cms

  datasource:
    url: jdbc:mysql://localhost:3306/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI}

# TODO: replace these placeholder defaults once the frontend team confirms real routes.
app:
  frontend:
    app-redirect-uri: ${FRONTEND_APP_REDIRECT_URI:https://placeholder.example.com/app}
    onboarding-redirect-uri: ${FRONTEND_ONBOARDING_REDIRECT_URI:https://placeholder.example.com/onboarding}
    error-redirect-uri: ${FRONTEND_ERROR_REDIRECT_URI:https://placeholder.example.com/error}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1800}

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
